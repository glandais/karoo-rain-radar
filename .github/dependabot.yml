    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "glandais"
    commit-message:
      prefix: "deps(gradle)"
      include: "scope"
    labels:
