services:
  radar-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rain-radar-backend
    ports:
      - "8080:8080"
    environment:
      - METEO_FRANCE_API_KEY=${METEO_FRANCE_API_KEY}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/api/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
